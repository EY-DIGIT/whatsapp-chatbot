menu.main=👋 नमस्ते! इंदौर नगर निगम के शिकायत निवारण चैटबॉट में आपका स्वागत है।\n\nआप आसानी से नई शिकायत दर्ज कर सकते हैं, स्थिति देख सकते हैं, या फीडबैक साझा कर सकते हैं।\n\nकृपया नीचे दिए गए विकल्पों में से चुनें:\n1️⃣ नई शिकायत दर्ज करें\n2️⃣ मौजूदा शिकायत की स्थिति देखें\n3️⃣ फीडबैक दें\n4️⃣ भाषा बदलें\n5️⃣ नागरिक बदलें\n \nआगे बढ़ने के लिए 1, 2, 3, 4 या 5 में से कोई भी नंबर भेजें।
prompt.choose_language=कृपया अपनी भाषा चुनें:\n1. English\n2. हिंदी
grievance.form=📝 इंदौर नगर निगम में अपनी शिकायत दर्ज करने के लिए कृपया नीचे दिया गया फॉर्म भरें।\n📋 शिकायत फॉर्म खोलने के लिए क्लिक करें:\n{0}
acknowledgement=✅ धन्यवाद! आपकी शिकायत सफलतापूर्वक दर्ज हो गई है।\n📄 शिकायत संख्या: {0}\n🗓️ दिनांक: {1}
track.not_found={0} आईडी के साथ कोई शिकायत नहीं मिली।
track.details=शिकायत संख्या: {0}\nस्थिति: {1}\nविवरण: {2}\nदिनांक: {3}\nअंतिम अपडेट: {4}\nटिप्पणियाँ: {5}
escalation=⚠️ आपकी शिकायत {0} निर्धारित समय सीमा में हल नहीं हुई है। इसे उच्च अधिकारियों को भेज दिया गया है।
resolution=🎉 शुभ समाचार! आपकी शिकायत {0} का समाधान कर दिया गया है।\nसमाधान दिनांक: {1}\nटिप्पणी: {2}\nकृपया हमारी सेवा को 1 से 5 के बीच रेट करें।
feedback.thanks=🙏 आपकी प्रतिक्रिया के लिए धन्यवाद! — इंदौर नगर निगम \nआपकी प्रतिक्रिया हमें अपनी सेवाओं में सुधार करने और नागरिक संतुष्टि सुनिश्चित करने में मदद करती है। \nआपका दिन शुभ हो! 🌟 \n— इंदौर नगर निगम, एक स्वच्छ और बेहतर इंदौर के लिए प्रतिबद्ध।
prompt.request_for=क्या आप शिकायत दर्ज कर रहे हैं:\n1️⃣ अपने लिए\n2️⃣ किसी और नागरिक के लिए\n\nआगे बढ़ने के लिए 1 या 2 भेजें।
prompt.request_for_other=कृपया उस नागरिक का संपर्क सत्यापित करें जिसके लिए आप शिकायत दर्ज कर रहे हैं:\n{0}
feedback.share=🙏 अपनी प्रतिक्रिया साझा करने का विकल्प चुनने के लिए धन्यवाद!\nकृपया निम्नलिखित में से उत्तर दें : \n⭐ 1 – खराब \n⭐⭐ 2 – औसत \n⭐⭐⭐ 3 – अच्छा \n⭐⭐⭐⭐ 4 – बहुत अच्छा \n⭐⭐⭐⭐⭐ 5 – उत्कृष्ट
track.wait=कृपया प्रतीक्षा करें, हम शिकायतों की सूची प्राप्त कर रहे हैं।
track.not_verified=नागरिक सत्यापित नहीं है। कृपया आगे बढ़ने के लिए अपना नंबर सत्यापित करें।
grievances.not_found={0} के लिए कोई शिकायत दर्ज नहीं है।