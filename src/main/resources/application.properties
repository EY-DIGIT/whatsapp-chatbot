spring.profiles.active=local
server.port=8080

# Postgres (update credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/whatsapp_bot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/main

# Redis
spring.redis.host=localhost
spring.redis.port=6379

# UTF-8 settings
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# WhatsApp config
whatsapp.meta-app-secret=to_set
whatsapp.webhook-verify-token=change_me_verify_token
whatsapp.api-token=to_set
whatsapp.api-base-url=https://graph.facebook.com/v22.0/{{to_set}}/messages

# Basic auth header value (base64 clientId:clientSecret)
digit.token.basic=to_set
# Credentials for resource owner password grant (replace with real values)
digit.token.username=to_set
digit.token.password=to_set
digit.token.scope=read
digit.token.grant_type=password
digit.token.userType=EMPLOYEE
# Tenant and search endpoint
digit.tenantId=mp.indore

egov.pgr.service.host=https://urbanimcdev.eydemoapp.in/
egov.pgr.search.path=pgr-services/v2/request/_search
egov.pgr.create.path=pgr-services/v2/request/_create

# Digit local proxies for OTP/OAuth (for the Digit UI endpoints)
egov.user.service.host=https://urbanimcdev.eydemoapp.in/
egov.user.send-otp.path=user-otp/v1/_send
egov.user.token.path=user/oauth/token

egov.form.host=https://urbanimcdev.eydemoapp.in/
egov.form.login.path=digit-ui/citizen/user/MobileLogin/
egov.form.grievance.path=digit-ui/citizen/user/GrievanceForm/

