spring.profiles.active=local
server.port=8080

# Postgres (update credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/whatsapp_bot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.redis.host=localhost
spring.redis.port=6379

# UTF-8 settings
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# WhatsApp config
whatsapp.webhook-verify-token=change_me_verify_token
whatsapp.api-token=to_set
whatsapp.api-base-url=https://graph.facebook.com/v22.0/{{to_set}}/messages

digit.token.url=https://urbanimcdev.eydemoapp.in/user/oauth/token
# Basic auth header value (base64 clientId:clientSecret)
digit.token.basic=to_set
# Credentials for resource owner password grant (replace with real values)
digit.token.username=to_set
digit.token.password=to_set
digit.token.scope=read
digit.token.grant_type=password
digit.token.userType=EMPLOYEE
# Tenant and search endpoint
digit.tenantId=mp.indore
digit.search.url=https://urbanimcdev.eydemoapp.in/pgr-services/v2/request/_search

# Digit local proxies for OTP/OAuth (for the Digit UI endpoints)
digit.otp.url=https://urbanimcdev.eydemoapp.in/user-otp/v1/_send
url.login.form=http://localhost:8080/login/form/
url.grievance.form=http://localhost:8080/grievance/form/
digit.create.url=https://urbanimcdev.eydemoapp.in/pgr-services/v2/request/_create