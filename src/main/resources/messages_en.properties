menu.main=👋 Hello! Welcome to Indore Nagar Nigam’s Grievance Redressal Chatbot.\n\nYou can easily register a grievance, check its status, or share feedback.\n\nPlease choose an option below:\n1️⃣ Register a new grievance\n2️⃣ Track existing grievance\n3️⃣ Provide feedback\n4️⃣ Change language\n5️⃣ Change citizen \n\nReply with the number (1, 2, 3, 4 or 5) to continue.
